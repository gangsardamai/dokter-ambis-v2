name: Apply Integrated Feature Patch

on:
  pull_request:
    branches:
      - feat/student-course-statistics

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/course-tryout-mvp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/course-tryout-mvp
          fetch-depth: 0

      - name: Reconstruct and verify patch
        run: |
          cat .github/feature-patch.part.00 \
              .github/feature-patch.part.01 \
              .github/feature-patch.part.02 \
              .github/feature-patch.part.03 \
            | base64 --decode > /tmp/feature-patch.tar.gz
          echo "de86f0ca6ac799a638ba5b549bd0cd6b77096017710c9209a15c430b55d47656  /tmp/feature-patch.tar.gz" \
            | sha256sum --check

      - name: Apply source changes
        run: |
          tar --extract --gzip --file /tmp/feature-patch.tar.gz --directory .
          rm -f .github/feature-patch.part.00 \
                .github/feature-patch.part.01 \
                .github/feature-patch.part.02 \
                .github/feature-patch.part.03

      - name: Prepare commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git status --short
          git diff --cached --stat

      - name: Commit source changes
        run: git commit -m "feat: mentor tryout images messages and payment accounts"

      - name: Push feature branch
        run: git push origin HEAD:feat/course-tryout-mvp
