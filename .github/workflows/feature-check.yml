name: Feature Check

on:
  pull_request:
    branches:
      - main
      - feat/student-course-statistics

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record base tree
        run: git rev-parse 'HEAD^{tree}' > base-tree-sha.txt

      - name: Upload base tree
        uses: actions/upload-artifact@v4
        with:
          name: base-tree-sha
          path: base-tree-sha.txt
          retention-days: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript
        id: typescript
        continue-on-error: true
        run: npx tsc --noEmit > typescript.log 2>&1

      - name: Upload TypeScript report
        if: steps.typescript.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typescript-report
          path: typescript.log
          retention-days: 1

      - name: Fail on TypeScript errors
        if: steps.typescript.outcome == 'failure'
        run: |
          cat typescript.log
          exit 1

      - name: Build
        run: npm run build
