name: Drive Migration Access Regression Tests
on:
  pull_request:
    paths:
      - "supabase/functions/drive-migration-general/**"
      - "tests/drive-ownership-access.test.mjs"
      - ".github/workflows/drive-migration-access-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run access policy tests
        run: node --test tests/drive-ownership-access.test.mjs
