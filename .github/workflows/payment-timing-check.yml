name: Payment Timing Branch Check

on:
  push:
    branches:
      - feature/payment-timing-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: branch-check-placeholder
          CLOUDFLARE_R2_ACCOUNT_ID: branch-check-placeholder
          CLOUDFLARE_R2_ACCESS_KEY_ID: branch-check-placeholder
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: branch-check-placeholder
          CLOUDFLARE_R2_BUCKET: branch-check-placeholder
