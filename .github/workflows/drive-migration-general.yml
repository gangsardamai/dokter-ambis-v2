name: Dokter Ambis Ownership Migration — Scoped
on:
  schedule:
    # 04:30, 08:30, 12:30, 16:30 and 20:30 Asia/Jakarta (UTC+7)
    - cron: "30 1,5,9,13,21 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Preview or one-off verified migrate"
        required: true
        type: choice
        options: [preview, migrate]
      manifest:
        description: "JSON manifest (owner use only, never include secrets)"
        required: true
        type: string
permissions: {}
concurrency:
  group: dokterambis-ownership-migration-v2
  cancel-in-progress: false
jobs:
  migrate-or-audit:
    if: >-
      github.repository_id == 1286701837 &&
      (github.event_name == 'schedule' || github.actor_id == '296064762')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    timeout-minutes: 45
    steps:
      - name: Build restricted request
        shell: bash
        env:
          MANIFEST: ${{ inputs.manifest }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            echo '{"action":"next"}' > /tmp/request.json
          else
            python3 - <<'PY'
          import json,os
          manifest=json.loads(os.environ["MANIFEST"])
          if not isinstance(manifest,dict) or not isinstance(manifest.get("entries"),list) or not 1<=len(manifest["entries"])<=10:
              raise SystemExit("Invalid manifest")
          with open("/tmp/request.json","w") as f:
              json.dump({"action":os.environ["ACTION"],"manifest":manifest},f)
          PY
          fi
      - name: Authenticated Edge Function invocation
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dokterambis-drive-migration-v2"
          oidc="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$url" | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          curl --fail-with-body --silent --show-error \
            -X POST -H "Authorization: Bearer ${oidc}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/request.json \
            "https://irpqxfpjqpiyqlzqoxdf.supabase.co/functions/v1/drive-migration-general" \
            > /tmp/result.json
          python3 - <<'PY'
          import json
          j=json.load(open("/tmp/result.json"))
          assert j.get("ok") is True, "Migration was safely stopped; inspect error log"
          # No secrets or individual file IDs in public GitHub logs.
          print("Mode:",j.get("mode","migrate"),"Migrated:",j.get("migrated",False),
                "References updated:",j.get("changed",0),
                "Source deleted:",j.get("sourceDeleted",False))
          PY
